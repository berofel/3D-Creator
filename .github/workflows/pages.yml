name: Deploy Berofel 3D Create to GitHub Pages

on:
  push:
    branches: [main, codex/fixed-workspace-ui-v1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  runner-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm GitHub-hosted runner
        run: |
          echo "GitHub-hosted runner is available."
          echo "Branch: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
